# gitleaks configuration — extends the default ruleset; CI runs `gitleaks git` over the full history.
# Allowlist ONLY deterministic test fixtures. Never add a real credential path here: rotate it and
# rewrite history instead (.claude/rules/code-quality.md).
[extend]
useDefault = true

[allowlist]
description = "Test fixtures that look like API keys"
paths = ['''apps/cli/tests/helpers\.ts''']
regexes = [
  '''_test_0123456789abcdefghijklmnopqrstuvwxyz''',
  # Launch's vendor fixtures (the FakeCloud's keys, the grants sentinel) — literal test values.
  '''^re_test_0123456789$''',
  '''^neon-test-key-0123456789$''',
  '''^napi_orgkey_0123456789abcdefghij$''',
  '''^sentinel-rotated-m365-secret-never-echoed$''',
  # The ship gate's redaction fixture (ship-gate-contract.test.ts) — a made-up Neon password.
  '''^npg_S3cretPassw0rd$''',
  # RFC 6455's sample Sec-WebSocket-Key ("the sample nonce", base64), quoted in a sessions plan.
  '''^dGhlIHNhbXBsZSBub25jZQ==$''',
  # A doc comment in services/launch/github-app.ts that NAMES the PKCS#1 header — no key follows it.
  '''^-----BEGIN RSA PRIVATE KEY-----`\)\. WebCrypto and `jose` import''',
]
