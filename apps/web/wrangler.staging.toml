# STAGING Worker config — standalone copy of wrangler.toml (the production file) — keep the
# two files in sync: same bindings/classes/limits, differing ONLY in name, routes, [vars]
# URLs/APP_ENV, and resource ids. tests/config/wrangler-parity.test.ts enforces this and
# fails while any <PLACEHOLDER> remains. See docs/DEPLOY.md and scripts/cf-provision.sh.

name = "launch-staging"
main = "src/worker.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# Fallback host launch-staging.<subdomain>.workers.dev while the custom domain is set up.
workers_dev = true

# Custom domain (wrangler creates the DNS record on deploy). Uncomment once the zone exists.
# routes = [{ pattern = "launch-staging.clewro.com", custom_domain = true }]

[vars]
APP_ENV = "staging"                    # development | staging | production
APP_URL = "https://launch-staging.clewro.com"  # public origin; derives OAuth redirect URIs, magic links, CSRF
APP_NAME = "Launch"
# Overridden at deploy time by CI: `wrangler deploy --var RELEASE_VERSION:<tag>`
RELEASE_VERSION = "dev"
LOG_LEVEL = "info"
EMAIL_FROM = "Launch <launch@notifications.clewro.com>"
TENANCY_MODE = "single"                # multi | single   (docs/CONCEPTS.md → Tenancy); Launch is one company
SIGNUP_MODE = "invite_only"            # open | invite_only | approval
TENANT_SCOPE_MODE = "off"              # off | enforce    (docs/RLS.md — enforce needs an app-role connection)
DATABASE_DRIVER = "neon"               # neon | postgres (D35, docs/DEPLOY.md § Database driver). Missing = postgres.
                                       # neon: the DATABASE_URL Worker secret (pooled Neon URI), no Hyperdrive.
                                       # postgres: the [[hyperdrive]] block below, any Postgres. Locally .dev.vars wins.
AGENT_MAX_OUTPUT_TOKENS = "16384"      # AI (D17): per-call max_tokens when a tenant config sets none
AGENT_MAX_TURNS = "30"                 # AI (D17): turn cap for every tool loop
CHAT_KNOWLEDGE_TOOLS = "true"          # AI (D18): chat may call the knowledge tools ("false" = tool-free chat)
CHAT_HISTORY_MAX_CHARS = "24000"       # AI (D17): history a chat turn replays; older turns are summarised
AGENT_INTERRUPT_TIMEOUT = "168 hours"   # Agents (#17): how long a run parked on a human waits (step.waitForEvent timeout)
FEATURES_ENABLED = ""                  # Feature flags (D30): keys this environment ships at all; blank = none (fail-closed)
OBSERVABILITY_CAPTURE_CONTENT = "true"  # Tracing (D32): "false" strips prompts/completions/tool I/O from the export AND ai_spans
OBSERVABILITY_SPAN_RETENTION_DAYS = "14"   # Tracing (D32): days of ai_spans the nightly prune keeps
SESSION_BACKEND = "cloud"              # Coding sessions (P3): cloud | local (local = wrangler dev only; loadConfig refuses it elsewhere)
SESSION_PREVIEW_URL = "https://{label}.clewro.com"  # P3: preview origins, {label} = <port>-<shortId>-<token> (docs/DEPLOY.md § Coding sessions)
GRANT_BACKEND = "cloudflare"            # Shared config (P5): cloudflare | local (local = wrangler dev only; loadConfig refuses it elsewhere)
SESSION_EGRESS = "open"                # P3: open | allowlist (missing = allowlist). open until the egress interception ends
                                       # a container's stream after a WebSocket closes (docs/plans/sandbox-websocket-close.md)
# Coding sessions' workspace backups (P3) — add to BOTH files, with the R2 secrets, to turn them on
# deployed (docs/DEPLOY.md § Coding sessions):  SESSION_WORKSPACE_BACKUP = "presigned"
# Tracing backend (D32) — add these to BOTH files when you pick one (docs/DEPLOY.md § Tracing):
#   OBSERVABILITY_PRESET = "langfuse"    # langfuse | phoenix | generic (unset + Langfuse keys = langfuse)
#   OTEL_EXPORTER_OTLP_ENDPOINT = "https://…"   # unset + Langfuse keys = <LANGFUSE_BASE_URL>/api/public/otel
#   OBSERVABILITY_TRACE_URL = "https://cloud.langfuse.com/project/<id>/traces/{traceId}"
#   Headers are a SECRET: `wrangler secret put OTEL_EXPORTER_OTLP_HEADERS` (k=v,k=v)
# Single sign-on through any OIDC issuer — add these to BOTH files (SETUP.md "Sign in with any OIDC issuer"):
#   OIDC_ISSUER = "https://idp.example.com/realms/acme"   # exactly the issuer's `issuer`; redirect URI {APP_URL}/auth/oidc/callback
#   OIDC_CLIENT_ID = "launch"
#   OIDC_LABEL = "Acme SSO"                 # button text (default "Single sign-on")
#   OIDC_SCOPES = "openid email profile"    # default; add "groups" if your issuer needs it
#   AUTH_OIDC_ONLY = "false"                # "true" = login page goes straight to the issuer, other methods hidden
#   OIDC_TRUST_EMAIL = "false"              # "true" = a MISSING email_verified counts as verified (single-tenant Entra); explicit false is always refused
#   The client secret is a SECRET: `wrangler secret put OIDC_CLIENT_SECRET` (omit for a public client)
# Secrets are NOT here: `wrangler secret put <NAME>` for every non-var in .dev.vars.example

[placement]
mode = "smart"                          # run near the database (Neon region), not the user

# [limits]
# cpu_ms = 30000   # Default. NOTE: Workflows bound CPU *per step* by this value too; if you
#                  # raise it, raise it identically in wrangler.staging.toml (parity test).

[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = false

# React SPA served from Workers Static Assets, deployed atomically with the Worker. API
# routes are matched by Hono first; the catch-all serves assets with SPA fallback.
[assets]
directory = "./dist/ui"
binding = "ASSETS"
not_found_handling = "single-page-application"
# The asset router runs BEFORE the Worker, and `single-page-application` answers any request it
# considers a navigation with index.html — without ever invoking `fetch`. `Sec-Fetch-Mode: navigate`
# is not just the address bar: an `<object>`/`<iframe>` embed and an `<a download>` click are
# navigations too. Launch P3 makes this `true` (every request reaches the Worker first): a coding
# session's PREVIEW is a navigation to `/` on `<port>-<shortId>-<token>.<preview domain>`, which the
# asset router would otherwise answer with Launch's own index.html. `src/worker.ts` sends preview
# hosts to the gateway before the Hono app; the app's catch-all serves `ASSETS` for everything else
# and JSON-404s the server prefixes (`API_PREFIXES`) — the parity test asserts both.
run_worker_first = true

# Postgres (D35). Under DATABASE_DRIVER = "neon" there is NO [[hyperdrive]] block — wrangler refuses
# to deploy one whose id does not exist — and the Worker reads the DATABASE_URL secret instead.
# `pnpm provision cloudflare staging --driver postgres` switches: it creates the Hyperdrive config, adds
# the block below to BOTH files and sets DATABASE_DRIVER = "postgres". The block it writes:
#   [[hyperdrive]]
#   binding = "HYPERDRIVE"
#   id = "<id>"
#   localConnectionString = "<.dev.vars DATABASE_URL>"

# KV for auth rate limiting + per-tenant operation locks. Create: wrangler kv namespace create RATE_LIMIT_STAGING
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "<KV_RATE_LIMIT_STAGING_ID>"

# Plugin bindings (D31) are appended to the sections above by `pnpm provision cloudflare <env>`,
# which reads each installed plugin’s plugin.json (bindings, crons, apiPrefixes, vars) and writes
# the same declarations into BOTH tomls. Never hand-edit one of a plugin’s blocks in one file only.

# Cron triggers — dispatched by src/api/scheduled.ts keyed on event.cron.
[triggers]
crons = [
  "0 4 * * *",     # Daily 04:00 UTC — prune expired sessions, magic links, rate-limit state
  "*/5 * * * *",   # Every 5 minutes — Launch polls every registered app environment's health
  # An installed plugin's crons go here too, identical in both files (D31): a plugin declares the
  # EXPRESSION in its `plugin.json` and contributes the TASK through `ServerPlugin.scheduledTasks`,
  # and a task registered under an expression no toml declares simply never runs. The analytics
  # plugin's is "15 * * * *" — hourly, rebuilding its fact tables per tenant.
]

# Background jobs (D7): one queue, one consumer; `src/api/queue.ts` dispatches on `batch.queue`.
# Create: wrangler queues create launch-jobs-staging
[[queues.producers]]
binding = "JOBS_QUEUE"
queue = "launch-jobs-staging"

[[queues.consumers]]
queue = "launch-jobs-staging"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
retry_delay = 60
# dead_letter_queue = "launch-jobs-staging-dlq"

# Realtime (D8): stateless WebSocket hub Durable Object, one instance per tenant
# (`idFromName(tenantId)`), hibernation API. Implementing a DO in-script disables preview URLs.
[[durable_objects.bindings]]
name = "NOTIFICATIONS_HUB"
class_name = "NotificationsHub"

[[migrations]]
tag = "v1"
new_classes = ["NotificationsHub"]

# Coding sessions (P3, spec/07): one Sandbox container per session. `SessionSandbox` IS the Durable
# Object (it extends the Sandbox SDK's class), reached with `getSandbox(env.SESSION_SANDBOX, id)`;
# SQLite-backed, as the SDK requires. `image` is built by `wrangler deploy` (and by `wrangler dev`,
# with Docker). **Changing the image or this block replaces running instances: drain sessions
# first** (docs/DEPLOY.md § Coding sessions). `max_instances` is also the cap on live sessions.
[[containers]]
class_name = "SessionSandbox"
image = "./containers/session/Dockerfile"
instance_type = "standard-3"
max_instances = 10

[[durable_objects.bindings]]
name = "SESSION_SANDBOX"
class_name = "SessionSandbox"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SessionSandbox"]

# File storage (D23): R2 behind `services/storage.ts`. Create: wrangler r2 bucket create launch-files-staging
[[r2_buckets]]
binding = "FILES"
bucket_name = "launch-files-staging"

# Coding sessions' workspace backups (P3, fast resume): the Sandbox SDK's FIXED binding name, on the
# SAME bucket as FILES (the SDK writes under backups/). Used by SESSION_WORKSPACE_BACKUP (off when
# deployed unless set; binding under wrangler dev). Give backups/ an R2 lifecycle rule (docs/DEPLOY.md).
[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "launch-files-staging"

# Workers AI (D17/D18): the zero-key floor for chat (`@cf/meta/llama-3.3-70b-instruct-fp8-fast`),
# embeddings (`@cf/baai/bge-m3`, 1024-dim) and document conversion (`AI.toMarkdown`); billed to this
# account. Optional in code: the resolver falls through to keys / tenant providers when absent.
[ai]
binding = "AI"
# Workers AI has no local emulation: wrangler dev calls Cloudflare even in dev (needs `wrangler login`).
# Comment this block out to run fully offline (toggle with `pnpm bootstrap --offline` / `--online`) —
# embeddings then fall back to EMBEDDINGS_API_KEY or "none".
remote = true

# App thumbnails (Browser Rendering): after a deploy goes live, the `app.thumbnail` job screenshots
# the app's root URL into R2 (`tenants/<id>/apps/<appId>/thumbnail-<env>.webp`). Needs Workers Paid
# for sensible limits (Free: 10 browser-minutes a day, 3 concurrent). Optional in code: without it
# the job logs and acks, and apps show their initial. Nothing to create. Under `wrangler dev` the
# binding is LOCAL — wrangler downloads a headless Chrome into its cache on the first capture; add
# `remote = true` to use Cloudflare's browsers instead (needs `wrangler login`).
[browser]
binding = "BROWSER"

# Agent runs (D7): the ONE Workflow class — the agent runtime IS the example workflow. `name` is
# ACCOUNT-scoped (staging uses `-staging`); binding and class_name are identical in both tomls.
# Nothing to create: `wrangler deploy` registers the Workflow. Instance id = agent_runs.id.
[[workflows]]
name = "launch-agent-run-staging"
binding = "AGENT_RUN_WORKFLOW"
class_name = "AgentRunWorkflow"

# Launch P2 (docs/plans/p2-create-app.md): creating and archiving an app. Each run is one
# instance, id = the pipeline run id (`<runId>-rN` on a retry); the steps record their ids in
# `app_operations`. `name` is ACCOUNT-scoped like the agent runs' (staging uses `-staging`).
[[workflows]]
name = "launch-app-create-staging"
binding = "APP_LAUNCH_WORKFLOW"
class_name = "AppLaunchWorkflow"

[[workflows]]
name = "launch-app-teardown-staging"
binding = "APP_TEARDOWN_WORKFLOW"
class_name = "AppTeardownWorkflow"

# Coding sessions (P3): one instance per session (id = sessions.id, `<id>-rN` on a restart) drives
# boot → the turn loop → ship or end → cleanup. `name` is ACCOUNT-scoped (staging uses `-staging`).
[[workflows]]
name = "launch-session-staging"
binding = "SESSION_WORKFLOW"
class_name = "SessionWorkflow"

# Shared config and grants (P5, docs/plans/p5-grants.md): one instance per push (id = the
# grant_pushes id, `<id>-rN` on a retry) puts or removes a shared resource's values as Worker
# secrets on every app holding it. `name` is ACCOUNT-scoped (staging uses `-staging`).
[[workflows]]
name = "launch-grant-push-staging"
binding = "GRANT_PUSH_WORKFLOW"
class_name = "GrantPushWorkflow"

# Personal AI accounts (§18.22, docs/CONCEPTS.md): one instance per sign-in (id = agent_logins.id)
# runs the provider's own CLI in a throwaway `login-<id>` sandbox (the SessionSandbox class) and
# seals the credential it writes. `name` is ACCOUNT-scoped (staging uses `-staging`).
[[workflows]]
name = "launch-agent-login-staging"
binding = "AGENT_LOGIN_WORKFLOW"
class_name = "AgentLoginWorkflow"

# ---- Added in later phases (keep this list in sync with wrangler.toml) ----------
# Phase 4 (D19): optional [[analytics_engine_datasets]] for product telemetry — not wired yet
