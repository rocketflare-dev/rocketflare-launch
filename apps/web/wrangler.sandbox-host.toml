# The SANDBOX HOST Worker — real Cloudflare containers for a laptop's Launch (development only).
# NOT part of Launch's deploy: Launch is `wrangler.toml` / `wrangler.staging.toml`, and this file is
# outside their parity test on purpose (it is one small Worker with one binding). Deployed by hand,
# as `launch-sandbox-dev`: `pnpm --filter @launch/web deploy:sandbox-host` (docs/DEPLOY.md § The
# sandbox host) — again whenever the session image or `src/sandbox-host/` changes. Local Launch
# reaches it through the REMOTE service binding `SANDBOX_HOST`, which `pnpm dev` declares in the
# `wrangler.dev-remote.toml` it generates whenever you are logged in and this Worker is deployed;
# a session runs here when the Session sandbox platform setting says so (docs/SESSIONS-LOCAL.md §
# Real containers from a laptop).
#
# Its containers hold no Launch credential: `HostedSessionSandbox`'s outbound handlers inject what
# local Launch grants each sandbox over the binding (the `host` egress mode) — the GitHub token,
# the turn's Anthropic key or subscription token, OpenAI key, or ChatGPT model, a sign-in's
# passthrough — kept in the sandbox's Durable Object storage. Its only secrets are the R2 token for
# workspace backups (below).

name = "launch-sandbox-dev"
main = "src/sandbox-host/worker.ts"
compatibility_date = "2026-06-01"          # = wrangler.toml (the SDK runs the same code on both)
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]  # the same runtime as Launch's own (sandbox-host.test.ts)

# No public URL: only a service binding in this account reaches the RPC surface.
workers_dev = false
preview_urls = false

# How the containers reach the internet — the same switch, and the same value, as Launch's tomls
# (SESSION_EGRESS in src/config.ts): open | allowlist, missing = allowlist. `open` until the egress
# interception ends a container's stream after a WebSocket closes (docs/plans/sandbox-websocket-close.md).
[vars]
SESSION_EGRESS = "open"
# Workspace backups (docs/SESSIONS-LOCAL.md § Suspend and resume): off | presigned (`binding` is
# refused here — it moves the whole archive through the Durable Object's 128 MB). The container
# uploads and downloads the archive itself over presigned R2 URLs; a restore mounts it with FUSE.
# Needs the R2 token as two secrets (Object Read & Write on BACKUP_BUCKET_NAME only):
#   pnpm --filter @launch/web exec wrangler secret put R2_ACCESS_KEY_ID -c wrangler.sandbox-host.toml
#   pnpm --filter @launch/web exec wrangler secret put R2_SECRET_ACCESS_KEY -c wrangler.sandbox-host.toml
# Until they are set every backup is refused, with the SDK's list of what is missing as the
# session's recorded reason, and a cold resume clones and installs as before. Local Launch backs a
# remote session up only when its own .dev.vars has CLOUDFLARE_ACCOUNT_ID (or BACKUP_BUCKET_ENDPOINT).
SESSION_WORKSPACE_BACKUP = "presigned"
BACKUP_BUCKET_NAME = "launch-files"        # = the BACKUP_BUCKET binding's bucket_name (sandbox-host.test.ts)
# PLACEHOLDER — your Cloudflare account id (`wrangler whoami`; not a secret). Empty = every backup
# is refused. A jurisdiction bucket sets BACKUP_BUCKET_ENDPOINT = "https://<account>.eu.r2.cloudflarestorage.com"
# instead. Local Launch's .dev.vars needs the same value.
CLOUDFLARE_ACCOUNT_ID = ""

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = false

# The same image and instance type as Launch's `SessionSandbox` (wrangler.toml), so a session
# behaves as it will deployed. `max_instances` caps the containers a laptop can run at once — and
# what can bill at once. Changing the image or this block replaces running instances.
[[containers]]
class_name = "HostedSessionSandbox"
image = "./containers/session/Dockerfile"
instance_type = "standard-3"
max_instances = 3

# `wrangler containers ssh <instance>` (`wrangler containers instances` lists them) for debugging a
# live session's container: the platform runs the SSH server, the image needs none. Public keys
# only (ed25519); a developer adds their own. Launch's deployed `SessionSandbox` has no SSH.
[containers.ssh]
enabled = true

[[containers.authorized_keys]]
name = "launch-dev"
public_key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEW+2HDFcrMKhlJdd3q7nOBKakNAi1+p9rAcIHO9+Jwj"

# Workspace backups: the Sandbox SDK's FIXED binding name, on the bucket local Launch's FILES names
# (wrangler.toml) — the same convention as the deployed tomls (BACKUP_BUCKET = the FILES bucket,
# objects under backups/). A deployed Worker's R2 binding is the real bucket; the SDK checks each
# presigned upload through it. Give backups/ an R2 lifecycle rule (docs/DEPLOY.md).
[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "launch-files"

[[durable_objects.bindings]]
name = "SESSION_SANDBOX"
class_name = "HostedSessionSandbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HostedSessionSandbox"]
